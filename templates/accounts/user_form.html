{% extends 'base.html' %}
{% block content %}
<div class="container py-3" style="max-width: 600px;">
    <div class="card shadow-sm border-0 p-4">
        <h3 class="fw-bold text-primary mb-3">➕ Tạo tài khoản mới (UC_1.1)</h3>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Tên đăng nhập *</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Họ và tên *</label>
                <input type="text" name="full_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Mật khẩu *</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Vai trò ban đầu *</label>
                <select name="role" class="form-select" required>
                    <option value="">-- Chọn vai trò --</option>
                    {% for code, name in roles %}
                        <option value="{{ code }}">{{ name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'user_list' %}" class="btn btn-secondary">Hủy</a>
                <button type="submit" class="btn btn-success fw-bold px-4">Lưu tài khoản</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
